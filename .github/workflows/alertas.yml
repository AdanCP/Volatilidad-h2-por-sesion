name: Bot Mane (cruce EMA13/34)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  revisar:
    # Interruptor que maneja la app: variable de repositorio BOT_ACTIVO.
    # Si no existe o vale "true", el bot corre; con "false" el job se omite.
    if: ${{ vars.BOT_ACTIVO != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      - run: pip install -r requirements-bot.txt

      - name: Revisar cruces
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          TEXTMEBOT_APIKEY: ${{ secrets.TEXTMEBOT_APIKEY }}
        run: python bot_alertas.py --una-vez

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado_alertas.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado"
          else
            git commit -m "Actualiza estado del bot"
            git push
          fi
